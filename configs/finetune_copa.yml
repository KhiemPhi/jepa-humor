seed: 42
experiment_name: finetune_copa_exp1
model_name: FacebookAI/roberta-large
dataset: super_glue
dataset_config: copa
num_choices: 2
max_length: 128  # premise + connector + choice is short
batch_size: 16
num_workers: 2
# fairseq commonsense_qa recipe (sentence_ranking): lr 1e-5, 3000 updates, 150 warmup (5%)
total_num_update: 3000
warmup_updates: 150
lr: 1.0e-5
weight_decay: 0.01  # multiple-choice tasks use 0.01 (matches commonsense_qa/WSC)
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
lr_scheduler: linear
ckpt_dir: checkpoints/finetune
results_dir: results
gpu_id: 7
save_best_model_on: test
swa: false
