seed: 42
experiment_name: finetune_boolq_exp1
model_name: FacebookAI/roberta-large
dataset: super_glue
dataset_config: boolq
test_dataset: super_glue
text_keys: ["passage", "question"]  # passage-first matches fairseq RoBERTa standard
num_labels: 2
max_length: 512  # BoolQ passages can be long
batch_size: 16
num_workers: 4
# No official fairseq config — RoBERTa general SuperGLUE recipe: ~10 epochs, 6% warmup
# train=9427, bs=16 → ~590 steps/epoch × 10 ≈ 5900 updates
total_num_update: 5900
warmup_updates: 354
lr: 1.0e-5
weight_decay: 0.1
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
lr_scheduler: linear
ckpt_dir: checkpoints/finetune
results_dir: results
gpu_id: 7
save_best_model_on: test  # SuperGLUE test labels are not public
swa: false
