seed: 42
experiment_name: finetune_qnli_exp1  # Prefix for all saved checkpoints
model_name: google-bert/bert-base-uncased   # ignored if --ckpt provided
dataset: nyu-mll/glue
dataset_config: qnli  # Specify QNLI configuration
test_dataset: nyu-mll/glue
text_keys: ["question", "sentence"]  # Column names to tokenize (e.g., ["premise", "hypothesis"] for MNLI)
num_labels: 2  # Number of classification labels (2 for binary, 3 for MNLI, etc.)
max_length: 256
batch_size: 16
num_workers: 4
epochs: 3
lr: 1.0e-5
mixed_precision: true
max_grad_norm: 0  # Gradient clipping norm (set to 0 to disable)
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0