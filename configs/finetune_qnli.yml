seed: 42
experiment_name: finetune_qnli_exp1  # Prefix for all saved checkpoints
model_name: bert-large-uncased # ignored if --ckpt provided
dataset: nyu-mll/glue
dataset_config: qnli  # Specify QNLI configuration
test_dataset: nyu-mll/glue
text_keys: ["question", "sentence"]  # Column names to tokenize
num_labels: 2  # Number of classification labels
max_length: 256
batch_size: 64
num_workers: 4
epochs: 20
lr: 1.0e-5
mixed_precision: true
max_grad_norm: 1.0
lr_scheduler: cosine
lr_warmup_ratio: 0.06
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
