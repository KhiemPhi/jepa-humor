seed: 42
experiment_name: finetune_sst2_exp1  # Prefix for all saved checkpoints
model_name: google-bert/bert-base-uncased   # ignored if --ckpt provided
dataset: nyu-mll/glue
dataset_config: sst2  # Specify MNLI configuration
test_dataset: nyu-mll/glue  # For validation sets
text_keys: ["sentence"]  # MNLI uses premise and hypothesis
num_labels: 2  # MNLI has 3 labels: entailment, neutral, contradiction
max_length: 256
batch_size: 32
num_workers: 4
epochs: 3
lr: 1.0e-5
mixed_precision: true
max_grad_norm: 0.0  # Gradient clipping norm (set to 0 to disable)
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 4
weight_decay: 0.001
#sample_percent: 10.0
