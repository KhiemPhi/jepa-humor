seed: 42
experiment_name: finetune_sst2_exp1  # Prefix for all saved checkpoints
model_name: FacebookAI/roberta-large  # ignored if --ckpt provided
dataset: nyu-mll/glue
dataset_config: sst2  # Specify SST-2 configuration
test_dataset: nyu-mll/glue  # For validation sets
text_keys: ["sentence"]  # SST-2 uses single sentence
num_labels: 2
max_length: 256
batch_size: 64
num_workers: 4
epochs: 20
lr: 1.0e-6
mixed_precision: true
max_grad_norm: 1.0
lr_scheduler: cosine
lr_warmup_ratio: 0.06
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
