seed: 42
model_name: distilbert/distilbert-base-uncased
dataset: CreativeLang/ColBERT_Humor_Detection
max_length: 256
batch_size: 256
num_workers: 4
epochs: 3
lr: 1.0e-3
ema_decay: 0.996
mask_ratio: 0.4
mean_span_len: 3.0
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 3
val_split: 0.8