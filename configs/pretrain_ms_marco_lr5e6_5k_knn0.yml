# Arm A for the DPR objective comparison: identical to the pretrain that produced
# dpr/jepa_bert_5k_hf (pretrain_ms_marco_lr5e6_600k.yml + max_steps=5000, as run by
# sh/run_pre5k_full.sh) with ONE change: knn_weight 0.1 -> 0.0, i.e. no kNN loss.
seed: 42
experiment_name: pretrain_msmarco_lr5e6_5k_knn0
model_name: bert-base-uncased
dataset: Tevatron/msmarco-passage-corpus
dataset_config: null
text_keys: ["text"]
max_length: 512
batch_size: 128
num_workers: 4
epochs: 10
max_steps: 5000
lr: 5.0e-6
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 999
val_split: 0.0001
gpu_id: 0
sample_percent: null
model_type: jepa
dynamic_masking: false
knn_weight: 0.0                 # the only change vs the reference pretrain (default is 0.1)
