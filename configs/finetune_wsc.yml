seed: 42
experiment_name: finetune_wsc_exp1
model_name: FacebookAI/roberta-large
dataset: super_glue
dataset_config: wsc
num_labels: 2  # coreferent / not_coreferent
max_length: 512
batch_size: 8
num_workers: 2
epochs: 60  # 2000 total updates: ceil(554/16)=35 steps/epoch → 2000/35 ≈ 57
lr: 2.0e-5
weight_decay: 0.01  # WSC-specific per fairseq wsc/README.md (differs from other tasks)
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
lr_scheduler: linear
lr_warmup_ratio: 0.125  # 250/2000 warmup per fairseq
cross_entropy_loss: true
ckpt_dir: checkpoints/finetune
results_dir: results
gpu_id: 7
save_best_model_on: test
swa: false
