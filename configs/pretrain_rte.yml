seed: 42
experiment_name: pretrain_rte_exp1  # Prefix for all saved checkpoints
model_name: bert-base-uncased
dataset: nyu-mll/glue
dataset_config: rte  # Specify RTE configuration
text_keys: ["sentence1", "sentence2"]  # RTE uses sentence1 and sentence2
max_length: 256
batch_size: 64
num_workers: 4
epochs: 3
lr: 1.0e-5
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 3
val_split: 0.8
gpu_id: 0
model_type: jepa
dynamic_masking: false
use_cls: true
