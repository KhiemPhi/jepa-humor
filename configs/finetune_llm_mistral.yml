seed: 42
experiment_name: finetune_llm_mistral
model_name: mistralai/Mistral-7B-v0.1
llm_mode: true
dataset: nyu-mll/glue
dataset_config: qnli
prompt_technique: zero-shot # Options: zero-shot, few-shot, chain_of_thought, self-consistency
num_shots: 0
"lora_r": 8,  # LoRA rank
"lora_alpha": 32,  # LoRA alpha
"lora_target_modules": ["q_proj", "v_proj"],  # Modules to apply LoRA to
"lora_dropout": 0.1,
text_keys: ["question", "sentence"]
num_labels: 2
max_length: 512
batch_size: 1
num_workers: 4
epochs: 3
lr: 1.0e-5
mixed_precision: false  # Disable for simplicity
max_grad_norm: 0
log_dir: runs/finetune_llm
ckpt_dir: checkpoints/finetune_llm
val_split: 0.8
gpu_id: 0