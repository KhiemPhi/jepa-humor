seed: 42
experiment_name: pretrain_mrpc_st
model_name: FacebookAI/roberta-large   # match rte encoder recipe
dataset: nyu-mll/glue
dataset_config: mrpc
text_keys: ["sentence1", "sentence2"]
max_length: 512
batch_size: 32
num_workers: 4
epochs: 1
lr: 3.0e-6
knn_weight: 0.1                        # kNN ON
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 3
val_split: 0.8                         # match rte pretrain recipe
gpu_id: 0
sample_percent: null
model_type: jepa
dynamic_masking: false
