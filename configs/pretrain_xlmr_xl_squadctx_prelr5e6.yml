seed: 42
experiment_name: pretrain_xlmr_xl_lora
model_name: facebook/xlm-roberta-xl        # 3.5B encoder (RoBERTa-family, has <mask>)
dataset: rajpurkar/squad
dataset_config: squad_context               # gated: dedup'd unique SQuAD train contexts -> "text"
sample_per_config: null
text_keys: ["text"]
max_length: 256
batch_size: 8
num_workers: 4
epochs: 1
lr: 5.0e-6
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: false      # fp32 pretrain (no fp16 autocast/scaler) -> no NaN divergence
log_dir: runs/pretrain
val_split: 0.0001
gpu_id: 0
sample_percent: null
model_type: jepa
dynamic_masking: false
# --- LoRA (Part 1, gated; XLM-specific) ---
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["query", "value"]
ckpt_dir: master_xlm/xlm_xl_squadctx_prelr5e6
