seed: 42
experiment_name: finetune_swag_exp1  # Prefix for checkpoints
model_name: FacebookAI/roberta-large
dataset: swag
dataset_config: swag  # Use SWAG-specific loader
text_keys: ["question", "sentence"]
num_labels: 4  # SWAG is multiple-choice with 4 options
max_length: 128
batch_size: 64
num_workers: 4
epochs: 3
lr: 2.0e-5
mixed_precision: true
max_grad_norm: 0
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
sample_percent: null  # set e.g. 10.0 for quick experiments

