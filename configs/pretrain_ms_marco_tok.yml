seed: 42
experiment_name: pretrain_msmarco_tok    # unique -> never overwrites pretrain_msmarco_* runs
model_name: bert-base-uncased
dataset: Tevatron/msmarco-passage-corpus
dataset_config: null
text_keys: ["text"]
max_length: 512
batch_size: 8
num_workers: 4
epochs: 1
max_steps: 30000                         # run script overrides to 1000
lr: 1.0e-6
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 999
val_split: 0.0001
gpu_id: 0
sample_percent: 0.3                      # ~3.3k steps/epoch, warmup~200 -> 3000 steps = proper real-LR run (batch8); avoids NaN seen at ~47k step
model_type: jepa
dynamic_masking: false
use_cls: false                           # #1: ONLY change vs pre5k_lr5e6 — token-level JEPA (matches ColBERT MaxSim)
