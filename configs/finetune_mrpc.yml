seed: 42
experiment_name: finetune_mrpc_exp1  # Prefix for all saved checkpoints
model_name: roberta-large  # Pre-trained model to fine-tune
dataset: nyu-mll/glue
dataset_config: mrpc  # Specify MRPC configuration
text_keys: ["sentence1", "sentence2"]  # MRPC uses sentence1 and sentence2
num_labels: 2  # MRPC is binary: paraphrase / not_paraphrase
max_length: 512
batch_size: 16
num_workers: 4
epochs: 10
lr: 1.0e-5
weight_decay: 0.1
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
hidden_dropout: 0.1        # fairseq model.dropout
attention_dropout: 0.1     # fairseq model.attention_dropout
head_dropout: 0.1          # MLP head dropout (fairseq=0.0; 0.1 beat 0.0 on SST-2, +0.34)
lr_scheduler: linear
lr_warmup_ratio: 0.06
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
save_best_model_on: test
metric_for_best_model: f1_acc_avg  # (macro-F1 + acc) / 2
swa: false
