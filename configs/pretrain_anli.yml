seed: 42
experiment_name: pretrain_anli_exp1  # Prefix for all saved checkpoints
model_name: FacebookAI/roberta-large
dataset: facebook/anli
dataset_config: anli  # Specify ANLI configuration
text_keys: ["premise", "hypothesis"]  # ANLI uses premise and hypothesis
train_rounds: [1, 2, 3]  # Which training rounds to aggregate: [1], [1, 2], or [1, 2, 3]
max_length: 256
batch_size: 32
num_workers: 4
epochs: 5
lr: 1.0e-5
ema_decay: 0.996
mask_ratio: 0.4
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 3
val_split: 0.8
gpu_id: 0
model_type: jepa
sample_percent: null  # Sample percentage for quick prototyping (default: null/100 = no sampling, set to 10.0 for 10% sampling)
smart_lambda: 1.0      # SMART regularization weight (0 = disabled)
smart_epsilon: 1e-6    # per-token L2 perturbation radius
smart_steps: 1         # PGD steps for finding worst-case δ
smart_step_size: 1e-3  # gradient ascent step size

