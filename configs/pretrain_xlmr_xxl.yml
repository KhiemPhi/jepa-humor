seed: 42
experiment_name: pretrain_xlmr_xxl_lora
model_name: facebook/xlm-roberta-xxl       # 10.7B encoder (RoBERTa-family, has <mask>)
dataset: wikimedia/wikipedia
dataset_config: ["20231101.en", "20231101.es", "20231101.de", "20231101.el", "20231101.ru", "20231101.tr", "20231101.ar", "20231101.vi", "20231101.th", "20231101.zh", "20231101.hi"]
sample_per_config: 10000                    # rows streamed+capped per language, auto-cached
text_keys: ["text"]
max_length: 256
batch_size: 2
num_workers: 4
epochs: 1
lr: 1.0e-4
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: master_xlm/xlm_xxl
early_stop_patience: 3
val_split: 0.0001
gpu_id: 0
sample_percent: null
model_type: jepa
dynamic_masking: false
# --- LoRA (Part 1, gated; XLM-specific) ---
# NOTE: xxl is 10.7B. The JEPA EMA target is a full deepcopy, so two fp16 copies
# (~21GB each) = ~43GB > 40GB and WILL NOT fit one A100-40GB as-is. Needs either
# base-sharing between online/target encoders, or FSDP/multi-GPU. See discussion.
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["query", "value"]
