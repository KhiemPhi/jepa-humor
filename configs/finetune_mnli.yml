seed: 42
experiment_name: finetune_mnli_exp1  # Prefix for all saved checkpoints
model_name: google-bert/bert-base-uncased   # ignored if --ckpt provided
dataset: nyu-mll/glue
dataset_config: mnli  # Specify MNLI configuration
test_dataset: nyu-mll/glue  # For validation sets
text_keys: ["premise", "hypothesis"]  # MNLI uses premise and hypothesis
num_labels: 3  # MNLI has 3 labels: entailment, neutral, contradiction
max_length: 256
batch_size: 16
num_workers: 4
epochs: 3
lr: 1.0e-5
mixed_precision: true
max_grad_norm: 0  # Gradient clipping norm (set to 0 to disable)
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
sample_percent: null  # Sample percentage for quick prototyping (default: null/100 = no sampling, set to 10.0 for 10% sampling)

