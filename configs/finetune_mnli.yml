seed: 42
experiment_name: finetune_mnli_exp1  # Prefix for all saved checkpoints
model_name: FacebookAI/roberta-large
dataset: nyu-mll/glue
dataset_config: mnli  # Specify MNLI configuration
test_dataset: nyu-mll/glue  # For validation sets
text_keys: ["premise", "hypothesis"]  # MNLI uses premise and hypothesis
num_labels: 3  # MNLI has 3 labels: entailment, neutral, contradiction
max_length: 512
batch_size: 32
num_workers: 4
epochs: 10                 # keep 10 -> LR linear decay is scheduled over 10 epochs
stop_after_epochs: 3       # ...but stop training after epoch 3 (MNLI peaks at ep2; LR trajectory unchanged)
lr: 1.0e-5
weight_decay: 0.1
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
hidden_dropout: 0.1        # fairseq model.dropout
attention_dropout: 0.1     # fairseq model.attention_dropout
head_dropout: 0.0          # MLP head dropout (fairseq=0.0; 0.1 beat 0.0 on SST-2, +0.34)
lr_scheduler: linear
lr_warmup_ratio: 0.06
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 3
save_best_model_on: test
metric_for_best_model: acc  # accuracy
swa: false
