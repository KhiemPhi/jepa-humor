seed: 42
experiment_name: finetune_wic_exp1
model_name: FacebookAI/roberta-large
dataset: super_glue
dataset_config: wic
test_dataset: super_glue
text_keys: ["sentence1", "sentence2"]  # word is prepended to sentence1 by finetune_superglue_wic
use_word_context: true  # prepend "{word}: " to sentence1 (standard WiC approach)
num_labels: 2
max_length: 512
batch_size: 16
num_workers: 4
epochs: 20
lr: 1.0e-5
weight_decay: 0.1
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
lr_scheduler: linear
lr_warmup_ratio: 0.06
ckpt_dir: checkpoints/finetune
results_dir: results
gpu_id: 7
save_best_model_on: test
swa: false
