seed: 42
experiment_name: finetune_wic_exp1
model_name: FacebookAI/roberta-large
dataset: super_glue
dataset_config: wic
test_dataset: super_glue
text_keys: ["sentence1", "sentence2"]  # word is prepended to sentence1 by finetune_superglue_wic
use_word_context: true  # prepend "{word}: " to sentence1 (standard WiC approach)
num_labels: 2
max_length: 512
batch_size: 16
num_workers: 4
# No official fairseq config — RoBERTa general SuperGLUE recipe: ~10 epochs, 6% warmup
# train=5428, bs=16 → ~340 steps/epoch × 10 ≈ 3400 updates
total_num_update: 3400
warmup_updates: 204
lr: 1.0e-5
weight_decay: 0.1
adam_betas: [0.9, 0.98]
adam_eps: 1.0e-6
mixed_precision: true
max_grad_norm: 0.0
lr_scheduler: linear
ckpt_dir: checkpoints/finetune
results_dir: results
gpu_id: 7
save_best_model_on: test
swa: false
head_dropout: 0.1
