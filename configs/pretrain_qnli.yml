seed: 42
experiment_name: pretrain_qnli_exp1  # Prefix for all saved checkpoints
model_name: FacebookAI/roberta-large
dataset: nyu-mll/glue
dataset_config: qnli  # Specify QNLI configuration
text_keys: ["question", "sentence"]  # Column names to tokenize (e.g., ["premise", "hypothesis"] for MNLI)
max_length: 256
batch_size: 32
num_workers: 4
epochs: 5
lr: 1.0e-5
ema_decay: 0.996
mask_ratio: 0.35
mean_span_len: 3.0
mask_type: random_token
tail_bias: 5.0
mixed_precision: true
log_dir: runs/pretrain
ckpt_dir: checkpoints/pretrain
early_stop_patience: 3
val_split: 0.8
gpu_id: 0
sample_percent: null  # Sample percentage for quick prototyping (default: null/100 = no sampling, set to 10.0 for 10% sampling)
model_type: jepa