seed: 42
model_name: bert-base-uncased
dataset: nyu-mll/glue
test_dataset: AI-Secure/adv_glue
max_length: 128
batch_size: 32                 # standard for BERT GLUE fine-tuning
num_workers: 4
epochs: 3                      # standard in both GLUE and AdvGLUE paper
lr: 2.0e-5                       # ensure float, not string
weight_decay: 0.01             # standard AdamW regularization
warmup_ratio: 0.1              # 10% linear warmup
mixed_precision: true
gradient_clip: 1.0
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
