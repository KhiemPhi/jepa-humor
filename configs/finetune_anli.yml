seed: 42
experiment_name: finetune_anli_exp1  # Prefix for all saved checkpoints
model_name: bert-base-uncased
dataset: facebook/anli
dataset_config: anli  # Specify ANLI configuration
test_dataset: facebook/anli
text_keys: ["premise", "hypothesis"]  # ANLI uses premise and hypothesis
train_rounds: [1, 2, 3]  # Which training rounds to aggregate: [1], [1, 2], or [1, 2, 3]
num_labels: 3
max_length: 256
batch_size: 64
num_workers: 4
epochs: 20
lr: 1.0e-5
mixed_precision: true
max_grad_norm: 1.0
lr_scheduler: cosine
lr_warmup_ratio: 0.06
log_dir: runs/finetune
ckpt_dir: checkpoints/finetune
val_split: 0.8
gpu_id: 0
